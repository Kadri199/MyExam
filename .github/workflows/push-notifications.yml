name: Send Kadri_Class push notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a one-time test notification to registered devices"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kadri-push-scheduler
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@^13
      - name: Send scheduled notifications
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SEND_TEST_PUSH: ${{ inputs.send_test }}
        run: node send-push-notifications.cjs
