name: Test Firebase service account
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Firebase secret and Firestore access
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          npm install --no-save firebase-admin
          node --input-type=module <<'NODE'
          import { initializeApp, cert } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';

          const raw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
          if (!raw) {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_JSON secret is missing or empty.');
          }

          let serviceAccount;
          try {
            serviceAccount = JSON.parse(raw);
          } catch {
            throw new Error('The secret is not valid JSON. Paste the complete service-account JSON file as the secret value.');
          }

          if (!serviceAccount.project_id || !serviceAccount.client_email || !serviceAccount.private_key) {
            throw new Error('The JSON is missing required service-account fields.');
          }

          const app = initializeApp({
            credential: cert(serviceAccount),
            projectId: serviceAccount.project_id
          });

          const db = getFirestore(app);
          await db.doc('settings/exams').get();

          console.log('SUCCESS: Firebase service account is valid and Firestore access works.');
          console.log('Project:', serviceAccount.project_id);
          console.log('No private key or secret contents were printed.');
          NODE
