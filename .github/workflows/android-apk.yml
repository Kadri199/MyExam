name: Build Kadri Class APK
on:
  push:
    branches: [main, master]
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Capacitor and generate Android project
        run: |
          npm install
          mkdir -p www
          printf '<!doctype html><html><head><meta charset="utf-8"></head><body>Kadri Class</body></html>' > www/index.html
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-v1
          name: Kadri_Class Android App
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
