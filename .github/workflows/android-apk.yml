name: Build Kadri Class APK
on:
  push:
    branches: [main, master]
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - 'app-icon.jpg'
      - 'google-services.json'
      - 'push-client.js'
      - 'service-worker.js'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Capacitor and generate Android project
        run: |
          npm install
          mkdir -p www
          printf '<!doctype html><html><head><meta charset="utf-8"></head><body>Kadri Class</body></html>' > www/index.html
          npx cap add android
          cp google-services.json android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              root_text = root_text.replace(
                  "dependencies {",
                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1
              )
              root.write_text(root_text)
          app = Path("android/app/build.gradle")
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app.write_text(app_text + "\napply plugin: 'com.google.gms.google-services'\n")
          PY
          npx cap sync android
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Image.open("app-icon.jpg").convert("RGBA")
          res = Path("android/app/src/main/res")
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")
          for density, size in [("mdpi",108),("hdpi",162),("xhdpi",216),("xxhdpi",324),("xxxhdpi",432)]:
              folder = res / f"mipmap-{density}"
              fg = Image.new("RGBA",(size,size),(0,0,0,0))
              side = int(size * 0.74)
              artwork = src.resize((side,side), Image.Resampling.LANCZOS)
              fg.alpha_composite(artwork,((size-side)//2,(size-side)//2))
              fg.save(folder / "ic_launcher_foreground.png")
          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive = '''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>'''
          (anydpi / "ic_launcher.xml").write_text(adaptive)
          (anydpi / "ic_launcher_round.xml").write_text(adaptive)
          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text(
              '<resources><color name="ic_launcher_background">#0C2D70</color></resources>')
          PY
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-v1
          name: Kadri_Class Android App
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
