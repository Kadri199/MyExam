<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>تحدي الضرب | Kadri_Class</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#eff6ff,#f0fdf4);font-family:Tahoma,Arial,sans-serif;color:#172554}
header{padding:18px max(18px,calc((100% - 900px)/2));display:flex;justify-content:space-between;align-items:center;background:#fff}
header a{color:#2563eb;text-decoration:none;font-weight:bold}
main{max-width:680px;margin:34px auto;padding:0 16px}
.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 12px 35px #1e3a8a12;text-align:center}
h1{margin:8px 0;color:#1d4ed8;font-size:clamp(1.6rem,5vw,2.2rem)}
.sub{color:#64748b;line-height:1.8}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}
.stat{background:#eff6ff;border-radius:14px;padding:10px 18px;min-width:105px}
.stat strong{display:block;font-size:1.3rem;color:#1d4ed8;margin-top:4px}
.progress{height:10px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:16px 0 26px}
#bar{height:100%;width:0;background:#22c55e;transition:width .25s}
.problem{font-size:clamp(2.8rem,12vw,4.5rem);font-weight:900;direction:ltr;margin:22px 0;color:#0f172a}
input{width:min(220px,70%);font-size:2rem;text-align:center;padding:12px;border:2px solid #cbd5e1;border-radius:14px;outline:none}
input:focus{border-color:#2563eb}
button{border:0;border-radius:13px;padding:13px 22px;font-size:1rem;font-weight:bold;cursor:pointer}
.primary{background:#2563eb;color:white}.secondary{background:#e2e8f0;color:#1e293b}
button:disabled{opacity:.5;cursor:not-allowed}
#feedback{min-height:32px;font-weight:bold;margin:12px 0}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.hidden{display:none!important}
#finish h2{font-size:2rem;color:#16a34a}
@media(max-width:480px){.card{padding:20px 14px}}
</style>
</head>
<body>
<header><strong>Kadri_Class 🎓</strong><a href="./index.html">العودة إلى الرئيسية ←</a></header>
<main>
<section class="card">
<div style="font-size:2.6rem">🎮 ✖️ 🌟</div>
<h1>تحدّي الضرب السريع</h1>
<p class="sub">تدرّب واستمتع! اضرب رقماً في رقم، واجمع أكبر عدد من النقاط.</p>
<div class="stats">
<div class="stat">السؤال<strong id="count">0 / 10</strong></div>
<div class="stat">النقاط<strong id="score">0</strong></div>
<div class="stat">الإجابات الصحيحة<strong id="correct">0</strong></div>
</div>
<div class="progress"><div id="bar"></div></div>
<div id="play">
<p class="sub">كم يساوي؟</p>
<div class="problem"><span id="a">3</span> × <span id="b">4</span> = ؟</div>
<form id="answerForm">
<input id="answer" type="number" inputmode="numeric" min="0" max="81" placeholder="؟" aria-label="الإجابة" required>
<div id="feedback" aria-live="polite"></div>
<div class="actions"><button class="primary" id="check" type="submit">تحقّق من الإجابة</button><button class="secondary" id="next" type="button" disabled>السؤال التالي ←</button></div>
</form>
</div>
<div id="finish" class="hidden">
<div style="font-size:3rem">🏆</div><h2>أحسنت!</h2>
<p id="finalText" class="sub"></p>
<button class="primary" id="again" type="button">العب مرة أخرى ↻</button>
</div>
</section>
</main>
<script>
(() => {
 const $ = id => document.getElementById(id);
 let a=1,b=1,round=0,score=0,correct=0,answered=false;
 function question(){
   a=1+Math.floor(Math.random()*9); b=1+Math.floor(Math.random()*9);
   $('a').textContent=a; $('b').textContent=b;
   $('answer').value=''; $('answer').disabled=false; $('check').disabled=false;
   $('next').disabled=true; $('feedback').textContent=''; answered=false;
   $('count').textContent=(round+1)+' / 10';
   $('score').textContent=score; $('correct').textContent=correct;
   $('bar').style.width=(round/10*100)+'%';
   $('answer').focus();
 }
 $('answerForm').addEventListener('submit',e=>{
   e.preventDefault(); if(answered)return;
   const raw=$('answer').value;
   if(raw===''){ $('feedback').textContent='اكتب الإجابة أولاً 🙂'; return; }
   answered=true;
   if(Number(raw)===a*b){score+=10;correct++;$('feedback').textContent='🎉 إجابة صحيحة! +10 نقاط';$('feedback').style.color='#16a34a';}
   else{$('feedback').textContent='ليست صحيحة. الجواب هو '+(a*b)+' 💪';$('feedback').style.color='#dc2626';}
   $('score').textContent=score;$('correct').textContent=correct;
   $('answer').disabled=true;$('check').disabled=true;$('next').disabled=false;
 });
 function advance(){
   round++;
   if(round>=10){$('play').classList.add('hidden');$('finish').classList.remove('hidden');$('bar').style.width='100%';$('finalText').textContent='أجبت إجابة صحيحة عن '+correct+' من 10 أسئلة، وجمعت '+score+' نقطة.';return;}
   question();
 }
 $('next').addEventListener('click',advance);
 $('again').addEventListener('click',()=>{round=0;score=0;correct=0;$('finish').classList.add('hidden');$('play').classList.remove('hidden');question();});
 question();
})();
</script>
</body>
</html>
